[package]
name = "postgres_otel_tracing_demo"
version = "0.1.0"
edition = "2021"
license = "PostgreSQL"
description = "Demo OpenTelemetry exporter for PostgreSQL contrib/otel via the OtelTracingApi rendezvous variable"
repository = "https://github.com/ringerc/postgres_otel_tracing_demo"

[lib]
# cdylib because we're producing a postgres loadable module (.so / .dylib /
# .dll) that postgres dlopens at startup.  Not a library other Rust code
# links against.
crate-type = ["cdylib"]

[dependencies]
# OpenTelemetry SDK + a couple of exporters.  Versions are pinned to a
# single minor; the OTel-rust ecosystem still occasionally reshuffles
# types across minors so we don't want cargo silently upgrading.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio"] }
opentelemetry-stdout = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }

# Async runtime used by BatchSpanProcessor.  Multi-thread flavor with one
# worker so the tonic exporter's hyper-based HTTP/2 client has a live
# reactor driving its socket I/O.  A current-thread runtime would make
# no progress unless something blocked in `block_on`, which a synchronous
# postgres backend never does --- so the previous "rt-tokio-current-thread"
# choice panicked on every OTLP export with "no reactor running".  See
# the README's "Per-backend SDK" section for the per-backend rationale.
#
# Features:
#   rt-multi-thread --- the multi-worker scheduler
#   net             --- needed by tonic's TcpStream / TLS plumbing
#   time            --- BatchSpanProcessor's flush timer + tonic timeouts
#   sync, macros    --- channels, ::pin!, etc., used by the SDK
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

# Lazy global initialization.
once_cell = "1"

[build-dependencies]
bindgen = "0.71"

[profile.release]
# Keep symbols readable so backtraces from the SDK or our FFI shim
# don't render as ?? in a postgres log.
strip = "none"
# LTO trims a noticeable amount off the .so but doubles link time;
# disable it for the demo to keep the dev loop fast.
lto = false
